<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #333;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }
    .status-dot.connected { background: #4CAF50; }
    .status-dot.connecting { background: #FFC107; }
    .status-dot.disconnected { background: #F44336; }
    .status-text {
      font-size: 14px;
      color: #666;
    }
    .info {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1565C0;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Browser Remote Control</h1>
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking...</span>
  </div>
  <div class="info" id="pluginInfo"></div>
  <button id="reconnectBtn" style="margin-top: 12px;">Reconnect</button>
  <script src="popup.js"></script>
</body>
</html>
